<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · 2D Game Studio</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .lost { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px 20px; }
    .lost img { width: 132px; height: 132px; margin: 0 auto 26px; border-radius: 28%; box-shadow: var(--shadow); rotate: -8deg; animation: bob 5s ease-in-out infinite; }
    .lost .display { font-size: clamp(48px, 10vw, 96px); }
    .lost p { color: var(--muted); font-size: 19px; max-width: 460px; margin: 16px auto 28px; }
  </style>
</head>
<body>
  <main class="lost">
    <div>
      <img src="/assets/shokoban/icon.webp" alt="" width="132" height="132">
      <h1 class="display">Oops, <span class="grad">stuck!</span></h1>
      <p>This page got pushed into a corner. Let's head back to the games.</p>
      <a class="btn btn--violet" href="/">Back to the games</a>
    </div>
  </main>
</body>
</html>
